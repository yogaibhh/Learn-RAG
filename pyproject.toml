[project]
name = "rag-wikipedia-id"
version = "0.1.0"
description = "Project RAG pertama: tanya-jawab di atas 50 artikel Wikipedia Bahasa Indonesia"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "rank-bm25>=0.2.2",
    "anthropic>=0.40",
    "streamlit>=1.40",
]

[project.optional-dependencies]
# Embedding lokal, dipasang hanya kalau perlu: uv sync --extra local
# Berat (~2.5 GB), makanya dipisah dari dependency utama.
local = [
    "torch>=2.8",
    "transformers>=4.57",
    "sentence-transformers>=3.3",
    "peft>=0.15.2",
    "einops>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
